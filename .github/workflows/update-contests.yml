name: Update contest data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contest-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh static snapshot
        run: python3 build.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- docs/data/contests.json docs/theme.css; then
            echo "No contest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/contests.json docs/theme.css
          git commit -m "chore: refresh contest data"
          git push
